name: iOS distribution
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-distribution-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release-policy:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.policy.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate ref and production protection
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_ENVIRONMENT" == production && "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            node -e 'const v=require("./app.json").expo.version; if(process.env.GITHUB_REF_NAME !== `ios-v${v}`) process.exit(1)'
            gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/environment.json"
            node <<'JS'
          const environment = require(process.env.RUNNER_TEMP + '/environment.json');
          const reviewers = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!reviewers?.reviewers?.length || environment.can_admins_bypass !== false) {
            throw new Error('Production requires environment reviewers and disabled admin bypass');
          }
          JS
            echo 'environment=production' >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_ENVIRONMENT" == staging && "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'environment=staging' >> "$GITHUB_OUTPUT"
          else
            echo 'Only main or a matching ios-vX.Y.Z tag can deploy' >&2
            exit 1
          fi
  distribute:
    needs: [validate, release-policy]
    if: vars.IOS_DISTRIBUTION_ENABLED == 'true'
    environment: ${{ needs.release-policy.outputs.environment }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IOS_APP_ENV: ${{ needs.release-policy.outputs.environment }}
      IOS_DISTRIBUTION: 'true'
      CI: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec ruby scripts/ios/signing_test.rb
      - name: Select configured Xcode
        env:
          IOS_XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION }}
        run: |
          set -euo pipefail
          [[ "$IOS_XCODE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Set IOS_XCODE_VERSION to an installed runner version'; exit 1; }
          test -d "/Applications/Xcode_${IOS_XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${IOS_XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run check:ios-config
      - name: Generate iOS from Expo configuration
        run: |
          test ! -d ios || { echo 'Expected a clean checkout without a native iOS project'; exit 1; }
          npx --no-install expo prebuild --platform ios --no-install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ vars.IOS_XCODE_VERSION }}-${{ hashFiles('package-lock.json', 'Gemfile.lock') }}
      - run: bundle exec pod install --project-directory=ios
      - name: Archive, verify, upload and wait for Apple processing
        env:
          IOS_UPLOAD_ENABLED: ${{ vars.IOS_UPLOAD_ENABLED }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bundle exec fastlane ios distribute
      - name: Retain generated dependency lock for diagnosis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios/Podfile.lock
          retention-days: 7
          if-no-files-found: ignore
      - name: Report failure
        if: failure()
        run: echo 'iOS distribution failed. Inspect the failed step; do not assume upload or Apple processing succeeded. Backend routing remains unisolated.' >> "$GITHUB_STEP_SUMMARY"
